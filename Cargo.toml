# =============================================================================
#  R E P S   ·   textbuf-lib
# =============================================================================
[package]
name    = "textbuf-lib"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Piece-tree text buffer for editors: fast inserts and deletes on huge files, line index, UTF-8/UTF-16 position conversion, snapshots."

# Keywords (5 max)
keywords = ["editor", "text-buffer", "piece-table", "rope", "unicode"]

# Categories
categories = ["text-editors", "data-structures", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/textbuf-lib"
repository    = "https://github.com/jamesgober/textbuf-lib"
documentation = "https://docs.rs/textbuf-lib"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "textbuf_lib"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party -lang dependencies are wired at v0.2.0, when first used.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
